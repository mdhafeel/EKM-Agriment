services:
  - type: web
    name: autoshop-manager
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3001
    disk:
      name: autoshop-data
      mountPath: /var/data
      sizeGB: 1
    healthCheckPath: /api/health
    autoDeploy: true
